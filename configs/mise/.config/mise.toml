[env]
_.file = [
  { path = '{{ env.HOME }}/.env.local' },
  { path = '{{ env.HOME }}/.secrets.yaml', redact = true },
]

[settings]
cargo.binstall = true
env_file = '.env.local'
experimental = true
idiomatic_version_file_enable_tools = ['pnpm']
npm.package_manager = 'pnpm'

[settings.age]
key_file = '{{ env.XDG_CONFIG_HOME }}/sops/age/keys.txt'

[settings.python]
uv_venv_auto = 'create|source'

[settings.sops]
age_key_file = '{{ env.XDG_CONFIG_HOME }}/sops/age/keys.txt'

[settings.status]
show_env = false
show_tools = false

[tools]
'cargo:bashka' = 'latest'
'cargo:tree-sitter-cli' = 'latest'
'cargo:zoxide' = 'latest'
age = 'latest'
bun = 'latest'
cargo-binstall = 'latest'
cloudflared = 'latest'
deno = 'latest'
erlang = 'latest'
fzf = 'latest'
gh = 'latest'
gleam = 'latest'
go = 'latest'
lazydocker = 'latest'
lazygit = 'latest'
lua-language-server = 'latest'
node = 'lts'
'npm:@ansible/ansible-language-server' = 'latest'
'npm:@fsouza/prettierd' = 'latest'
'npm:@olrtg/emmet-language-server' = 'latest'
'npm:@shopify/cli' = 'latest'
'npm:@tailwindcss/language-server' = 'latest'
'npm:bash-language-server' = 'latest'
'npm:eslint_d' = 'latest'
'npm:fish-lsp' = 'latest'
'npm:typescript-language-server' = 'latest'
'npm:vscode-langservers-extracted' = 'latest'
'npm:yaml-language-server' = { version = 'latest', install_env = { PNPM_CONFIG_NODE_LINKER = 'hoisted' } }
odin = 'latest'
ols = 'latest'
pnpm = 'latest'
python = 'latest'
railway = 'latest'
ruby = 'latest'
rust = 'latest'
shellcheck = 'latest'
shfmt = 'latest'
sops = 'latest'
stylua = 'latest'
tombi = 'latest'
uv = 'latest'
zig = 'latest'
zls = 'latest'
