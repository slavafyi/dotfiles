[env]
_.file = [
  { path = '{{ env.HOME }}/.env.local' },
  { path = '{{ env.HOME }}/.secrets.yaml', redact = true },
]

[settings]
cargo.binstall = true
env_file = '.env.local'
experimental = true
idiomatic_version_file_enable_tools = ['pnpm']

[settings.age]
key_file = '{{ env.XDG_CONFIG_HOME }}/sops/age/keys.txt'

[settings.python]
uv_venv_auto = 'create|source'

[settings.sops]
age_key_file = '{{ env.XDG_CONFIG_HOME }}/sops/age/keys.txt'

[settings.status]
show_env = false
show_tools = false

[tools]
'cargo:bashka' = 'latest'
'cargo:tree-sitter-cli' = 'latest'
'cargo:zoxide' = 'latest'
age = 'latest'
bun = 'latest'
cargo-binstall = 'latest'
deno = 'latest'
erlang = 'latest'
gleam = 'latest'
go = 'latest'
node = 'lts'
odin = 'latest'
pnpm = 'latest'
python = 'latest'
ruby = 'latest'
rust = 'latest'
sops = 'latest'
uv = 'latest'
zig = 'latest'
